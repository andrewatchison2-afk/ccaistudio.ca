<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Outer glow -->
  <circle cx="60" cy="60" r="52" fill="rgba(230,57,70,0.08)"/>
  <!-- Main puck -->
  <circle cx="60" cy="60" r="46" fill="#081322" stroke="#E63946" stroke-width="2.5"/>
  <!-- Puck inner ring detail -->
  <circle cx="60" cy="60" r="38" fill="none" stroke="#132843" stroke-width="1"/>
  <!-- Ice texture lines -->
  <line x1="26" y1="60" x2="94" y2="60" stroke="#132843" stroke-width="0.8"/>
  <!-- The C letterform — bold, slightly italic -->
  <text
    x="60" y="78"
    font-family="'Bebas Neue', sans-serif"
    font-size="56"
    font-weight="400"
    fill="#F0F6FF"
    text-anchor="middle"
    transform="skewX(-5)"
    letter-spacing="-2"
  >C</text>
  <!-- Red accent slash through puck edge -->
  <path d="M 85 28 L 92 36" stroke="#E63946" stroke-width="3" stroke-linecap="round"/>
  <path d="M 87 32 L 94 40" stroke="#E63946" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>
