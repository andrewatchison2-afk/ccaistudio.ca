<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#040C1A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#081322;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1E35;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F4A620;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD166;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E63946;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4D5B;stop-opacity:1" />
    </linearGradient>
    <filter id="softBlur2"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="goldGlow2">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#1C3A5C" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad2)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Glow blobs -->
  <ellipse cx="300" cy="200" rx="350" ry="250" fill="#F4A620" opacity="0.05" filter="url(#softBlur2)"/>
  <ellipse cx="950" cy="430" rx="280" ry="200" fill="#E63946" opacity="0.06" filter="url(#softBlur2)"/>

  <!-- Top gold accent bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#goldGrad2)"/>

  <!-- Logo area -->
  <circle cx="90" cy="72" r="40" fill="#081322" stroke="#E63946" stroke-width="2"/>
  <circle cx="90" cy="72" r="33" fill="none" stroke="#132843" stroke-width="1"/>
  <line x1="60" y1="72" x2="120" y2="72" stroke="#132843" stroke-width="0.8"/>
  <text x="90" y="89" font-family="Arial Black, Impact, sans-serif" font-size="44" font-weight="900" fill="#F0F6FF" text-anchor="middle" transform="skewX(-5)">C</text>
  <line x1="112" y1="45" x2="118" y2="53" stroke="#E63946" stroke-width="2.5" stroke-linecap="round"/>
  <text x="142" y="62" font-family="Arial Black, Impact, sans-serif" font-size="30" font-weight="900" fill="#F0F6FF" letter-spacing="3">COACHD</text>
  <text x="142" y="84" font-family="Arial, sans-serif" font-size="13" fill="#8BAFD4" letter-spacing="2">HOCKEY INTELLIGENCE</text>

  <!-- BIG headline -->
  <text x="80" y="190" font-family="Arial Black, Impact, sans-serif" font-size="70" font-weight="900" fill="url(#goldGrad2)" letter-spacing="-1" filter="url(#goldGlow2)">TRYOUT SEASON</text>
  <text x="80" y="265" font-family="Arial Black, Impact, sans-serif" font-size="60" font-weight="900" fill="#F0F6FF" letter-spacing="1">IS COMING.</text>
  <text x="80" y="335" font-family="Arial Black, Impact, sans-serif" font-size="48" font-weight="900" fill="#8BAFD4">IS YOUR PLAYER READY?</text>

  <!-- Red accent line -->
  <rect x="80" y="358" width="100" height="4" fill="url(#redGrad2)" rx="2"/>

  <!-- Steps -->
  <!-- Step 1 -->
  <circle cx="100" cy="406" r="18" fill="#E63946" opacity="0.9"/>
  <text x="100" y="413" font-family="Arial Black, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="128" y="400" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#F0F6FF">Ask Coachd anything — game situations, drills,</text>
  <text x="128" y="421" font-family="Arial, sans-serif" font-size="17" fill="#8BAFD4">positioning, edge work, mental prep</text>

  <!-- Step 2 -->
  <circle cx="100" cy="468" r="18" fill="#F4A620" opacity="0.9"/>
  <text x="100" y="475" font-family="Arial Black, sans-serif" font-size="16" font-weight="900" fill="#081322" text-anchor="middle">2</text>
  <text x="128" y="462" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#F0F6FF">Get instant, intelligent answers built for</text>
  <text x="128" y="483" font-family="Arial, sans-serif" font-size="17" fill="#8BAFD4">your player's age and level</text>

  <!-- Step 3 -->
  <circle cx="100" cy="530" r="18" fill="#3EBD6E" opacity="0.9"/>
  <text x="100" y="537" font-family="Arial Black, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="128" y="524" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#F0F6FF">Walk into tryouts with the edge everyone</text>
  <text x="128" y="545" font-family="Arial, sans-serif" font-size="17" fill="#8BAFD4">else wishes they had</text>

  <!-- Right side visual — trophy / star cluster -->
  <!-- Big star/target -->
  <circle cx="920" cy="295" r="170" fill="none" stroke="#1C3A5C" stroke-width="2" opacity="0.5"/>
  <circle cx="920" cy="295" r="120" fill="none" stroke="#264D78" stroke-width="1.5" opacity="0.5"/>
  <circle cx="920" cy="295" r="70" fill="none" stroke="#4A7BA8" stroke-width="1.5" opacity="0.6"/>
  <circle cx="920" cy="295" r="30" fill="#F4A620" opacity="0.15"/>
  <circle cx="920" cy="295" r="16" fill="#F4A620" opacity="0.5" filter="url(#goldGlow2)"/>

  <!-- Crosshairs -->
  <line x1="750" y1="295" x2="830" y2="295" stroke="#264D78" stroke-width="1.5" opacity="0.6"/>
  <line x1="1010" y1="295" x2="1090" y2="295" stroke="#264D78" stroke-width="1.5" opacity="0.6"/>
  <line x1="920" y1="125" x2="920" y2="205" stroke="#264D78" stroke-width="1.5" opacity="0.6"/>
  <line x1="920" y1="385" x2="920" y2="465" stroke="#264D78" stroke-width="1.5" opacity="0.6"/>

  <!-- Stat cards floating -->
  <!-- "Make the team" card -->
  <rect x="820" y="228" width="200" height="72" rx="10" fill="#081322" stroke="#F4A620" stroke-width="1.5"/>
  <text x="920" y="256" font-family="Arial Black, sans-serif" font-size="13" font-weight="900" fill="#F4A620" text-anchor="middle">MAKE THE TEAM</text>
  <text x="920" y="275" font-family="Arial, sans-serif" font-size="11" fill="#8BAFD4" text-anchor="middle">AI-powered tryout preparation</text>
  <text x="920" y="290" font-family="Arial, sans-serif" font-size="11" fill="#8BAFD4" text-anchor="middle">for every position &amp; level</text>

  <!-- "Free trial" badge -->
  <rect x="758" y="148" width="145" height="60" rx="10" fill="#132843" stroke="#3EBD6E" stroke-width="1.5"/>
  <text x="830" y="172" font-family="Arial, sans-serif" font-size="11" fill="#3EBD6E" text-anchor="middle">7 DAYS</text>
  <text x="830" y="196" font-family="Arial Black, sans-serif" font-size="20" font-weight="900" fill="#F0F6FF" text-anchor="middle">FREE TRIAL</text>

  <!-- Skill tags -->
  <rect x="763" y="370" width="110" height="34" rx="17" fill="#132843" stroke="#264D78" stroke-width="1.2"/>
  <text x="818" y="392" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#4A90D9" text-anchor="middle">⛸ Skating</text>

  <rect x="883" y="370" width="110" height="34" rx="17" fill="#132843" stroke="#264D78" stroke-width="1.2"/>
  <text x="938" y="392" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#F4A620" text-anchor="middle">🧠 Mental</text>

  <rect x="1003" y="370" width="110" height="34" rx="17" fill="#132843" stroke="#264D78" stroke-width="1.2"/>
  <text x="1058" y="392" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#E63946" text-anchor="middle">🏒 Drills</text>

  <rect x="763" y="415" width="145" height="34" rx="17" fill="#132843" stroke="#264D78" stroke-width="1.2"/>
  <text x="835" y="437" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#3EBD6E" text-anchor="middle">📍 Positioning</text>

  <rect x="918" y="415" width="145" height="34" rx="17" fill="#132843" stroke="#264D78" stroke-width="1.2"/>
  <text x="990" y="437" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#8BAFD4" text-anchor="middle">💬 Q&amp;A Anytime</text>

  <!-- CTA bottom -->
  <rect x="763" y="480" width="320" height="55" rx="8" fill="url(#redGrad2)"/>
  <text x="923" y="513" font-family="Arial Black, Impact, sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">START FREE → coachdhockey.ca</text>

  <!-- Bottom bar -->
  <rect x="0" y="625" width="1200" height="5" fill="url(#goldGrad2)" opacity="0.7"/>
</svg>
